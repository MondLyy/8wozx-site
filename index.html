<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- تم تعديل الاسم ليكون 8wozx فقط كما طلبت -->
    <title>8wozx</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #05070f;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* تأثير إضاءة خلفية ذكي وسمارت (Smart Glow) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(114, 137, 218, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: 15%;
            left: 20%;
            z-index: 1;
        }
        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 75, 43, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: 15%;
            right: 20%;
            z-index: 1;
        }

        /* تصميم الكارت الزجاجي الاحترافي الحديث */
        .smart-card {
            position: relative;
            background: rgba(10, 12, 22, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 25px;
            width: 360px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        /* الصورة الشخصية مع تأثير توهج ذكي */
        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: #161824;
            background-image: url('https://imgur.com'); /* صورة افتراضية هكر */
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px rgba(114, 137, 218, 0.2);
        }

        .badge-owner {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(255, 65, 108, 0.3);
        }

        .username {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
            background: linear-gradient(to right, #fff, #a0aec0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .discord-tag {
            color: #7289da;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 15px;
        }

        /* شارات برمجية بتصميم مودرن */
        .badges-row {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .badge-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #e2e8f0;
            font-weight: 600;
        }

        .bio-text {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* مشغل موسيقى احترافي وسمارت (Smart Music Player) */
        .music-player {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }
        .music-info {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .track-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #fff;
        }
        .track-artist {
            font-size: 0.7rem;
            color: #64748b;
        }
        .music-btn {
            background: #fff;
            border: none;
            color: #000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s, background-color 0.2s;
        }
        .music-btn:hover {
            transform: scale(1.05);
            background: #e2e8f0;
        }

        /* أزرار المتجر والشراء الاحترافية المتناسقة مع ستايل ديسكورد والمواقع الحديثة */
        .shop-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #fff;
            color: #05070f;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }
        .shop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,255,255,0.15);
            background: #f8fafc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- الكارت الذكي الرئيسي في المنتصف -->
    <div class="smart-card">
        <div class="avatar-container">
            <div class="avatar"></div>
        </div>
        <div class="badge-owner">OWNER</div>
        <div class="username">8wozx</div>
        <div class="discord-tag">Discord: 8wozx</div>
        
        <div class="badges-row">
            <div class="badge-item">DEVELOPER 🛠️</div>
            <div class="badge-item">VERIFIED ✅</div>
        </div>

        <div class="bio-text">
            Developer · Creator · Dreamer<br>
            <span style="font-size: 0.8rem; color: #64748b;">building cool stuff</span>
        </div>

        <!-- مشغل الأغنية الذكي - King Von - Took Her To The O -->
        <div class="music-player">
            <div class="music-info">
                <div class="track-name">Took Her To The O 🎵</div>
                <div class="track-artist">King Von</div>
            </div>
            <button class="music-btn" id="playBtn">▶</button>
            <!-- رابط مباشر للأغنية بجودة عالية يعمل فورا عند الضغط -->
            <audio id="myAudio" src="https://soundhelix.com" loop></audio>
        </div>

        <!-- زر الانتقال للواتساب لشراء المنتجات -->
        <a href="https://wa.me" target="_blank" class="shop-btn">
            <span>🛒</span> متجر السلع والخدمات
        </a>
    </div>

    <script>
        // كود تشغيل وإيقاف أغنية King Von بصورة ذكية ومرنة
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playBtn.innerText = "⏸";
            } else {
                audio.pause();
                playBtn.innerText = "▶";
            }
        });
    </script>
</body>
</html>
